<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Buttons</title></head>
<body><div class="card" style="display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button style="background:var(--emerald-500);color:#062218;border:0;padding:13px 24px;border-radius:14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 0 24px rgba(0,240,160,0.35);cursor:pointer;font-family:inherit">Save $250 →</button>
    <button style="background:var(--crimson-500);color:#fff;border:0;padding:13px 24px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 0 20px rgba(255,59,48,0.3);cursor:pointer;font-family:inherit">Pay Debt</button>
    <button style="background:rgba(255,255,255,0.06);color:#F5F5F7;border:1px solid rgba(255,255,255,0.12);padding:13px 24px;border-radius:14px;font-weight:600;font-size:14px;backdrop-filter:blur(20px);cursor:pointer;font-family:inherit">Cancel</button>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button style="background:transparent;color:var(--emerald-500);border:1px solid rgba(0,240,160,0.35);padding:10px 20px;border-radius:9999px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit">Ghost Emerald</button>
    <button style="background:transparent;color:var(--text-tertiary);border:0;padding:10px 16px;font-weight:500;font-size:13px;cursor:pointer;font-family:inherit">Skip</button>
    <button disabled style="background:var(--obsidian-600);color:var(--mist-500);border:0;padding:13px 24px;border-radius:14px;font-weight:600;font-size:14px;cursor:not-allowed;font-family:inherit">Disabled</button>
  </div>
  <div class="tok">Save = emerald fill + emerald glow · Destructive = crimson + crimson glow · Secondary = frosted glass · Ghost = 1px accent border</div>
</div></body></html>
