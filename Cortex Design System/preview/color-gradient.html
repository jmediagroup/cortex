<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Hero gradients</title></head>
<body><div class="card">
  <div style="position:relative;height:160px;border-radius:var(--radius-xl);overflow:hidden;background:radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,240,160,0.16), transparent 60%), radial-gradient(ellipse 50% 40% at 80% 110%, rgba(191,90,242,0.15), transparent 60%), radial-gradient(ellipse 50% 40% at 10% 110%, rgba(90,200,250,0.10), transparent 60%), #0A0E14;border:1px solid var(--border-subtle)">
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000, transparent)"></div>
    <div style="position:relative;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px">
      <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.14em;color:var(--emerald-500);display:inline-flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:var(--emerald-500);box-shadow:0 0 12px var(--emerald-500)"></span>Trust &amp; Growth</span>
      <span style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#F5F5F7">Emerald on Obsidian</span>
    </div>
  </div>
  <div class="tok" style="margin-top:12px">Radial emerald/purple/info on Obsidian 900 · faint white grid · mask fade.</div>
</div></body></html>
