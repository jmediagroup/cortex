<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Pulse Card</title></head>

      <div style="display:flex;align-items:center;gap:10px">

        <div><div style="font-size:13px;font-weight:500;color:var(--mist-300)">Savings · Chase</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--mist-500);letter-spacing:0.1em">•••• 4092</div></div>
      </div>
      <span style="font-size:10px;color:var(--mist-500);display:inline-flex;align-items:center;gap:4px"><span style="width:5px;height:5px;border-radius:50%;background:var(--emerald-500);box-shadow:0 0 8px var(--emerald-500)"></span>LIVE</span>
    </div>
    <div style="font-size:32px;font-weight:600;letter-spacing:-0.03em;color:#F5F5F7;font-variant-numeric:tabular-nums">$124,528<span style="color:var(--mist-400)">.40</span></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
      <span style="display:inline-flex;align-items:center;gap:4px;color:var(--emerald-500);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums">↑ 2.4% <span style="color:var(--mist-400);font-weight:500">7d</span></span>
      <svg width="100" height="28" viewBox="0 0 100 28" style="overflow:visible">
        <path d="M0,20 L14,16 L28,18 L42,12 L56,14 L70,8 L84,10 L100,4" fill="none" stroke="#00F0A0" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M0,20 L14,16 L28,18 L42,12 L56,14 L70,8 L84,10 L100,4 L100,28 L0,28 Z" fill="url(#g)"/>
        <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#00F0A0" stop-opacity="0.3"/><stop offset="100%" stop-color="#00F0A0" stop-opacity="0"/></linearGradient></defs>
