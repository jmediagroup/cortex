<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Badges</title></head>
<body><div class="card" style="display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <span style="background:rgba(0,240,160,0.12);color:var(--emerald-500);padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid rgba(0,240,160,0.22);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums">↑ 12.4%</span>
    <span style="background:rgba(255,59,48,0.12);color:var(--crimson-500);padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid rgba(255,59,48,0.22);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums">↓ 3.2%</span>
    <span style="background:rgba(255,255,255,0.06);color:var(--mist-300);padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid var(--border-default)">— 0%</span>
    <span style="background:rgba(255,184,0,0.12);color:#FFB800;padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid rgba(255,184,0,0.22)">Near limit</span>
    <span style="background:rgba(90,200,250,0.12);color:#5AC8FA;padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid rgba(90,200,250,0.22)">Forecast</span>
  </div>
  <div class="tok">Delta chips are flat tint + 1px tint border. Tabular figures keep columns aligned in transaction lists.</div>
</div></body></html>
