<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Spacing</title></head>
<body><div class="card">

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:28px;background:var(--emerald-500)"></div><span class="tok">8 · 2</span></div>

  </div>
