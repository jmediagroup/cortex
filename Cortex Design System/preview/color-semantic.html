<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Semantic</title></head>
<body><div class="card">
  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="display:inline-flex;align-items:center;gap:6px;background:rgba(0,240,160,0.12);color:var(--emerald-500);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid rgba(0,240,160,0.2)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>+12.4%</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)">positive / save · #00F0A0</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,59,48,0.12);color:var(--crimson-500);padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid rgba(255,59,48,0.2)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>Over budget</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)">negative / debt · #FF3B30</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,184,0,0.12);color:#FFB800;padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid rgba(255,184,0,0.22)">Approaching limit</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)">warning · #FFB800</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="display:inline-flex;align-items:center;gap:6px;background:rgba(90,200,250,0.12);color:#5AC8FA;padding:6px 12px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid rgba(90,200,250,0.22)">Prediction</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)">info / ghost line · #5AC8FA</span>
    </div>
  </div>
</div></body></html>
