<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Chart palette</title></head>
<body><div class="card">
  <div class="grid" style="grid-template-columns:repeat(6,1fr)">
    <div class="swatch" style="background:#00F0A0;color:#06221A"><span class="name">Emerald</span><span class="hex">#00F0A0</span></div>
    <div class="swatch" style="background:#FF3B30"><span class="name">Crimson</span><span class="hex">#FF3B30</span></div>
    <div class="swatch" style="background:#5AC8FA;color:#0A0E14"><span class="name">Info</span><span class="hex">#5AC8FA</span></div>
    <div class="swatch" style="background:#BF5AF2"><span class="name">Purple</span><span class="hex">#BF5AF2</span></div>
    <div class="swatch" style="background:#FFB800;color:#0A0E14"><span class="name">Amber</span><span class="hex">#FFB800</span></div>
    <div class="swatch" style="background:#FF66C4;color:#0A0E14"><span class="name">Pink</span><span class="hex">#FF66C4</span></div>
  </div>
  <div class="tok" style="margin-top:12px">Sankey: Info=Needs · Purple=Wants · Emerald=Investments. Lines on obsidian with 15–18% alpha fills.</div>
</div></body></html>
