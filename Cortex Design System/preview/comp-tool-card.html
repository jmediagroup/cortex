<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Tool card</title></head>
<body><div class="card">
  <div style="max-width:300px;padding:20px;border-radius:20px;background:rgba(255,255,255,0.05);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06)">
    <div style="width:44px;height:44px;border-radius:12px;background:rgba(0,240,160,0.14);color:var(--emerald-500);display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:1px solid rgba(0,240,160,0.2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/></svg></div>
    <h4 style="font-size:16px;font-weight:600;color:#F5F5F7;margin:0 0 6px;letter-spacing:-0.01em">Compound Interest</h4>
    <p style="color:var(--mist-400);font-weight:400;line-height:1.5;font-size:13px;margin:0 0 14px">See how your money grows over time with different contribution strategies.</p>
    <span style="color:var(--emerald-500);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px">Open tool →</span>
  </div>
</div></body></html>
