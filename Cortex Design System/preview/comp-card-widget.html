<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Credit card</title></head>
<body><div class="card">
  <div style="max-width:320px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#0A0E14 0%,#121620 60%,#1C1C1E 100%);padding:20px;color:#fff;border:1px solid rgba(0,240,160,0.18);box-shadow:0 0 40px rgba(0,240,160,0.15),inset 0 1px 0 rgba(255,255,255,0.08)">
    <div style="position:absolute;top:-30px;right:-30px;width:180px;height:180px;background:radial-gradient(circle,rgba(0,240,160,0.2),transparent 70%);pointer-events:none"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;position:relative">
      <div style="width:38px;height:30px;border-radius:6px;background:linear-gradient(135deg,rgba(0,240,160,0.4),rgba(0,240,160,0.1));border:1px solid rgba(0,240,160,0.3)"></div>
      <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--emerald-500);display:inline-flex;align-items:center;gap:4px"><span style="width:5px;height:5px;border-radius:50%;background:var(--emerald-500);box-shadow:0 0 8px var(--emerald-500)"></span>ACTIVE</span>
    </div>
    <p class="num" style="font-size:17px;letter-spacing:0.18em;margin:0 0 20px;color:#F5F5F7">4356  1234  2134  0909</p>
    <div style="display:flex;align-items:flex-end;justify-content:space-between">
      <div><p style="font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--mist-500);margin:0">Card Holder</p><p style="font-size:13px;font-weight:500;margin:2px 0 0;color:#F5F5F7">Aria Khan</p></div>
      <div style="text-align:right"><p style="font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--mist-500);margin:0">Expires</p><p class="num" style="font-size:13px;font-weight:500;margin:2px 0 0;color:#F5F5F7">06 / 28</p></div>
    </div>
  </div>
  <div class="tok" style="margin-top:12px">Obsidian gradient · emerald chip + corner glow · mono number.</div>
</div></body></html>
