<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Smart Amount input</title></head>
<body><div class="card" style="display:flex;flex-direction:column;gap:16px;max-width:360px">
  <div><label style="display:block;font-size:11px;font-weight:600;color:var(--mist-400);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.12em">Email</label><input value="aria@cortex.vip" style="width:100%;padding:13px 14px;border:1px solid var(--border-default);border-radius:12px;font-size:14px;font-family:inherit;color:#F5F5F7;background:rgba(255,255,255,0.04);outline:none"></div>
  <div>
    <label style="display:block;font-size:11px;font-weight:600;color:var(--emerald-500);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.12em">Transfer to savings</label>
    <div style="position:relative">
      <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--emerald-500);font-size:18px;font-family:var(--font-mono);font-weight:500">$</span>
      <input value="2,500.00" style="width:100%;padding:14px 14px 14px 30px;border:1px solid rgba(0,240,160,0.35);border-radius:12px;font-size:18px;font-family:var(--font-mono);font-weight:500;color:#F5F5F7;background:rgba(0,240,160,0.06);outline:none;box-shadow:0 0 0 4px rgba(0,240,160,0.08), 0 0 24px rgba(0,240,160,0.12)">
    </div>
    <div class="tok" style="margin-top:6px;color:var(--emerald-500)">Field glows emerald when destination is savings.</div>
  </div>
</div></body></html>
