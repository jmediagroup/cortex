<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Filter pills</title></head>
<body><div class="card">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button style="background:var(--emerald-500);color:#062218;border:0;padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 0 16px rgba(0,240,160,0.3)">April</button>
    <button style="background:rgba(255,255,255,0.06);color:var(--mist-300);border:1px solid var(--border-default);padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">May</button>
    <button style="background:rgba(255,255,255,0.06);color:var(--mist-300);border:1px solid var(--border-default);padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">June</button>
    <button style="background:rgba(255,255,255,0.06);color:var(--mist-300);border:1px solid var(--border-default);padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">July</button>
    <button style="background:rgba(255,255,255,0.06);color:var(--mist-300);border:1px solid var(--border-default);padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">August</button>
  </div>
  <div class="tok" style="margin-top:12px">Active = emerald fill + glow. Inactive = frosted glass + silver-mist label.</div>
</div></body></html>
