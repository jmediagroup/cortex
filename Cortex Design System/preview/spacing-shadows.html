<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><title>Shadows & glow</title></head>
<body><div class="card">
  <div class="row" style="gap:20px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:64px;background:var(--obsidian-700);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.06);border:1px solid var(--border-subtle)"></div><span class="tok">card</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:64px;background:var(--obsidian-600);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.06);border:1px solid var(--border-default)"></div><span class="tok">hover</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:64px;background:var(--obsidian-600);border-radius:20px;box-shadow:0 16px 48px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08);border:1px solid var(--border-default)"></div><span class="tok">elevated</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:64px;background:var(--obsidian-700);border-radius:16px;box-shadow:0 0 32px rgba(0,240,160,0.45);border:1px solid rgba(0,240,160,0.3)"></div><span class="tok">emerald glow</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:64px;background:var(--obsidian-700);border-radius:16px;box-shadow:0 0 24px rgba(255,59,48,0.4);border:1px solid rgba(255,59,48,0.28)"></div><span class="tok">crimson glow</span></div>
  </div>
  <div class="tok" style="margin-top:14px">Dark-UI elevation uses black shadow + 6% inner top hairline. Glow is reserved for state: emerald = safe/success · crimson = alert · pulse animated.</div>
</div></body></html>
